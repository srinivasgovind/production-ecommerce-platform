# Hooks that run automatically before every `git commit`.
# Install once per clone with: pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1 # pinned version: same behavior on every machine
    hooks:
      - id: gitleaks # blocks the commit if staged changes contain a secret

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files # stops accidental big files (datasets, binaries)
      - id: detect-private-key # extra check for SSH/TLS private keys
      - id: end-of-file-fixer # every file ends with a newline
      - id: trailing-whitespace # removes spaces at line ends

  # Our own tools, run through uv so they use the SAME versions as uv.lock
  # (and mypy can see fastapi etc. installed in .venv).
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (lint)
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy (types)
        entry: uv run mypy src tests
        language: system
        types: [python]
        pass_filenames: false # check the whole project, not just changed files
