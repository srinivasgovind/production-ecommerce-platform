# Local development services. Start: docker compose up -d   Stop: docker compose down
services:
  db:
    image: postgres:17-alpine  # pinned major version; same Postgres everywhere
    environment:
      POSTGRES_USER: store
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}  # read from .env, never written here
      POSTGRES_DB: store
    ports:
      - "127.0.0.1:5432:5432"  # reachable from this Mac only, not from the network
    volumes:
      - pgdata:/var/lib/postgresql/data  # data survives container restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U store -d store"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
